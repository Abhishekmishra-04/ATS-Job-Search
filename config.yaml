# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  include_titles:
    # Core software engineering roles
    - '\b(software|backend|back-end)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(backend|back-end|software)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - 'software development engineer'
    - 'software engineer'
    - 'software developer'

    # Python / Backend roles
    - '\bpython\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\bpython\b'
    - '\bfastapi\b.*\b(engineer|developer)\b'
    - '\bbackend\b.*\b(python|fastapi|node)\b'
    - '\bapi\b.*\b(engineer|developer)\b'
    - '\bapi engineer\b'
    - '\bbackend engineer\b'
    - '\bbackend developer\b'

    # Node.js / JavaScript backend roles
    - '\b(node\.?js|node)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(node\.?js|node)\b'
    - '\bnode\.?js backend\b'

    # Full Stack roles
    - '\bfull[\s-]?stack\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\bfull[\s-]?stack\b'
    - '\bmern\b.*\b(engineer|developer)\b'
    - '\bmern stack\b'

    # Frontend / React roles — secondary target but still relevant
    - '\b(frontend|front-end)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(frontend|front-end)\b'
    - '\breact\b.*\b(engineer|developer)\b'
    - '\breact\.?js\b.*\b(engineer|developer)\b'

    # AI / LLM application roles
    - '\b(ai|artificial intelligence)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(ai|artificial intelligence)\b'
    - '\b(llm|large language model)\b.*\b(engineer|developer)\b'
    - '\b(engineer|developer)\b.*\b(llm|large language model)\b'
    - '\bgenerative ai\b.*\b(engineer|developer)\b'
    - '\bgenai\b.*\b(engineer|developer)\b'
    - '\bai application\b.*\b(engineer|developer)\b'
    - '\bllm application\b.*\b(engineer|developer)\b'

    # Associate / Junior roles
    - '\bassociate software engineer\b'
    - '\bjunior software engineer\b'
    - '\bjunior backend engineer\b'
    - '\bjunior backend developer\b'
    - '\bsoftware engineer i\b'
    - '\bsoftware engineer 1\b'
    - '\bagent\b.*\b(engineer|developer)\b'
    - '\bai solutions\b'
    - '\bweb developer\b'
    - '\bsite reliability engineer\b'
    - '\bsre\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(intern|internship|apprentice|trainee)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'
    - '\b(ios|android|mobile|game|designer)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\bdevrel\b'
    - '\bdeveloper relations\b'
    - '\bdesign systems\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  # Leave empty to accept every location.
  locations:
    - bangalore
    - bengaluru
    - noida
    - gurgaon
    - gurugram
    - delhi
    - hyderabad
    - pune
    - mumbai
    - chennai
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this. Set to null to disable.
  # Boards often re-stamp `updated_at`, so this is a soft signal, not a promise.
  max_age_days: 90

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 4.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# Automatically send email digest when SMTP is configured
send_email: true

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv